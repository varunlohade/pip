<style>html,body,#root{background:0 0;height:100%;margin:0;overflow:hidden}.pip-step{z-index:1000;pointer-events:none;color:#1c1c1e;align-items:baseline;gap:6px;font:500 13px -apple-system,system-ui,sans-serif;display:flex;position:absolute;top:8px;left:8px;right:8px}.pip-step b{color:#8e8e93;flex:none;font-weight:600}.pip-step span{background:#ffffffd9;border-radius:8px;padding:3px 7px}.pip-pen{z-index:1001;pointer-events:none;background:#0a84ff;border-radius:50%;width:14px;height:14px;margin:-7px 0 0 -7px;transition:opacity .3s;position:absolute;box-shadow:0 0 0 4px #0a84ff40}@media (prefers-color-scheme:dark){.pip-step{color:#f2f2f7}.pip-step span{background:#1c1c1ed9}}</style>
